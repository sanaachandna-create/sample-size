name: Update news

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push to Discord? (type yes)"
        required: false
      team:
        description: "Favorite team full name (optional)"
        required: false
      watchlist:
        description: "Players, comma-separated (optional)"
        required: false
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull headlines + push breaking news
        env:
          FAV_TEAM: ${{ github.event.inputs.team || 'Atlanta Hawks' }}
          WATCHLIST: ${{ github.event.inputs.watchlist }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_PUSH: ${{ github.event.inputs.test == 'yes' && '1' || '' }}
        run: python news.py
      - name: Commit the data if it changed
        run: |
          git config user.name "sample-size-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "news: update $(date -u +%FT%TZ)"
          git push
