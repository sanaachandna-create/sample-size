name: Update news

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Favorite team full name, e.g. Atlanta Hawks"
        required: false
      watchlist:
        description: "Players, comma-separated (optional)"
        required: false
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull headlines
        env:
          FAV_TEAM: ${{ github.event.inputs.team || 'Atlanta Hawks' }}
          WATCHLIST: ${{ github.event.inputs.watchlist }}
        run: python news.py
      - name: Commit the data if it changed
        run: |
          git config user.name "sample-size-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "news: update $(date -u +%FT%TZ)"
          git push
