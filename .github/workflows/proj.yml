name: Update projections

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year (blank = 2026 for 2026-27)"
        required: false
  schedule:
    # season averages change once per game, not per minute — refresh every 3h
    - cron: "30 */3 * * *"

concurrency:
  group: update-projections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the projections worker
        env:
          SEASON: ${{ github.event.inputs.season }}
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: python proj.py

      - name: Commit the data if it changed
        run: |
          git config user.name "sample-size-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/proj.json /tmp/proj.json
          for i in 1 2 3 4 5 6; do
            git add data/proj.json
            if git diff --staged --quiet; then
              echo "no change — nothing to commit"; exit 0
            fi
            git commit -m "proj: update $(date -u +%FT%TZ)"
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected (attempt $i) — syncing to remote and retrying"
            git reset --soft HEAD~1
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/proj.json data/proj.json
            sleep $((RANDOM % 6 + 2))
          done
          echo "could not push after 6 attempts"; exit 1
