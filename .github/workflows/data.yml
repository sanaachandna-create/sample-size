name: Update NBA data

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date YYYYMMDD (leave blank for today)"
        required: false
  schedule:
    # every 5 min during game hours (10a-3a ET), every 30 min overnight — public repo = free minutes
    - cron: "*/5 16-23 * * *"
    - cron: "*/5 0-7 * * *"
    - cron: "*/30 8-15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the worker
        env:
          GAME_DATE: ${{ github.event.inputs.date }}
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: python worker.py

      - name: Commit the data if it changed
        run: |
          git config user.name "sample-size-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/today.json
          git diff --staged --quiet || git commit -m "data: update $(date -u +%FT%TZ)"
          git push
