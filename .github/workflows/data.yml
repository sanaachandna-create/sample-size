name: Update NBA data

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date YYYYMMDD (leave blank for today)"
        required: false
  schedule:
    # every 5 min during game hours (10a-3a ET), every 30 min overnight — public repo = free minutes
    - cron: "*/5 16-23 * * *"
    - cron: "*/5 0-7 * * *"
    - cron: "*/30 8-15 * * *"

# avoid racing our own runs; if a new run starts, let it supersede a queued one
concurrency:
  group: update-nba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the worker
        env:
          GAME_DATE: ${{ github.event.inputs.date }}
          BDL_KEY: ${{ secrets.BDL_KEY }}
        run: python worker.py

      - name: Commit the data if it changed
        run: |
          git config user.name "sample-size-bot"
          git config user.email "bot@users.noreply.github.com"
          # Our worker regenerates data/today.json wholesale, so on a push
          # collision we just grab the freshest remote and lay our file back
          # on top — no merge conflicts, newest data always wins.
          cp data/today.json /tmp/today.json
          for i in 1 2 3 4 5 6; do
            git add data/today.json
            if git diff --staged --quiet; then
              echo "no change — nothing to commit"; exit 0
            fi
            git commit -m "data: update $(date -u +%FT%TZ)"
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected (attempt $i) — syncing to remote and retrying"
            git reset --soft HEAD~1            # undo our commit, keep the file staged state
            git fetch origin main
            git reset --hard origin/main        # match remote exactly
            cp /tmp/today.json data/today.json  # restore our freshly generated file
            sleep $((RANDOM % 6 + 2))           # small random backoff to de-sync from cron
          done
          echo "could not push after 6 attempts"; exit 1
